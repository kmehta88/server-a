apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server-a
  template:
    metadata:
      labels:
        app: server-a
    spec:
      containers:
      - name: server-a
        image: service-a:latest
        imagePullPolicy: Never # Crucial for Docker Desktop local images
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: server-a
spec:
  type: NodePort
  selector:
    app: server-a
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
